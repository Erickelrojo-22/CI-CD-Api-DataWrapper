name: Publish Datawrapper Chart

on:
  push:
    branches: [main]
    paths:
      - "data/**"
  workflow_dispatch:

jobs:
  test-and-publish:
    name: Test & Publish Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Publish chart to Datawrapper
        env:
          DATAWRAPPER_API_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}
          DATAWRAPPER_CHART_ID: ${{ secrets.DATAWRAPPER_CHART_ID }}
        run: python src/datawrapper_publisher.py --csv-path data/cobertura_modulos.csv
